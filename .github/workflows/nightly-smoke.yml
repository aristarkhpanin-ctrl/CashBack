# =====================================================================
# Nightly smoke: полный docker-стек + healthchecks + demo-seed +
# обучение ранжирующей модели + e2e денежного пути.
#
# Не гоняется на PR (стек тяжёлый — Kafka, ClickHouse, MLflow);
# ловит деградации compose-конфигурации, образов, миграций и денежного
# пути раз в сутки и по ручному запуску.
#
# Набор сервисов: горячий путь без Airflow. recommendation-api грузит
# модель только из стадии Production реестра MLflow: без неё
# /health/ready и /recommendations отвечают 503 (mobile-api — 502), и
# e2e невозможен. Поэтому после сида ml-training (профиль compose `ml`,
# как `make train-models`) обучает модель на данных сидера и продвигает
# её в Production, а ModelWatcher подхватывает её за
# MODEL_POLL_INTERVAL_SECONDS (60 с в docker-compose.yml).
# HEALTHCHECK образов — /health/live: «all healthy» от модели не зависит.
# =====================================================================
name: nightly-smoke

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC ежедневно
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-compose:
    name: docker compose up + seed + model + API smoke + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SMOKE_SERVICES: >-
        postgres clickhouse redis kafka schema-registry mlflow
        recommendation-api campaign-manager mobile-api
        transaction-listener frontend

    steps:
      - uses: actions/checkout@v4

      # pip на системном python3 ubuntu-24.04 запрещён (PEP 668) —
      # ставим зависимости сидера/e2e в python из setup-python.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Явная сборка из текущего коммита: без неё `up`/`run` взяли бы образ
      # cashback/*:0.1.0, если он уже есть, и ошибки сборки смешались бы
      # с ошибками старта.
      - name: Build service images
        run: |
          read -ra services <<< "$SMOKE_SERVICES"
          docker compose build "${services[@]}"
          docker compose --profile ml build ml-training
          df -h /

      - name: Start core stack (без Airflow — только горячий путь)
        run: |
          read -ra services <<< "$SMOKE_SERVICES"
          docker compose up -d "${services[@]}"

      - name: Wait for service health
        run: |
          set -e
          for i in $(seq 1 60); do
            unhealthy=$(docker compose ps --format json | \
              python3 -c "import json,sys; \
                rows=[json.loads(l) for l in sys.stdin if l.strip()]; \
                bad=[r['Service'] for r in rows \
                     if r.get('Health','') not in ('healthy','') or r['State']!='running']; \
                print(' '.join(bad))")
            if [ -z "$unhealthy" ]; then echo "all healthy"; exit 0; fi
            echo "waiting ($i/60): $unhealthy"; sleep 10
          done
          docker compose ps
          docker compose logs --tail 50
          exit 1

      # Сидер и e2e ниже — на закреплённых версиях из
      # tests/requirements-integration.txt (psycopg2-binary, redis, aiokafka,
      # confluent-kafka[avro] …). Ставятся после `make migrate`: с alembic
      # в PATH scripts/init_db.sh мигрировал бы из этого окружения, а не
      # одноразовым контейнером, как раньше.
      - name: Apply migrations + seed demo data
        run: |
          make migrate
          pip install -r tests/requirements-integration.txt
          python scripts/seed_demo_data.py \
            --pg-dsn postgresql://cashback:cashback@localhost:5432/cashback \
            --ch-url http://localhost:8123 \
            --redis-url redis://localhost:6379/0 \
            --users 200 --tx-per-user 20

      # Признаки — user_rfm_features в ClickHouse, метки — рекомендации
      # с откликом в Postgres (оба пишет сидер). На пустом MLflow первая
      # модель продвигается в Production без сравнения с предыдущей.
      - name: Train + promote the ranking model (make train-models)
        run: |
          set -o pipefail
          make train-models | tee "$RUNNER_TEMP/train.log"
          if ! grep -q '"promoted": true' "$RUNNER_TEMP/train.log"; then
            echo "::error::train-all did not promote a model to Production"
            exit 1
          fi

      - name: Wait for recommendation-api to load the model (/health/ready)
        run: |
          for i in $(seq 1 36); do
            if curl -sf http://localhost:8001/health/ready; then
              echo; echo "recommendation-api ready"; exit 0
            fi
            echo "waiting for the model ($i/36)"; sleep 5
          done
          curl -s http://localhost:8001/health/ready; echo
          docker compose logs --tail 100 recommendation-api
          exit 1

      - name: API smoke (auth → campaigns → analytics → recommendations)
        run: |
          set -e
          TOKEN=$(curl -sf -X POST http://localhost:8002/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@bank.ru","password":"admin"}' \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          AUTH="Authorization: Bearer $TOKEN"
          curl -sf -H "$AUTH" http://localhost:8002/campaigns | head -c 200; echo
          curl -sf -H "$AUTH" "http://localhost:8002/analytics/funnel?period=30" | head -c 200; echo
          curl -sf -H "$AUTH" http://localhost:8002/experiments | head -c 200; echo
          curl -sf http://localhost:8001/health/live
          curl -sf http://localhost:8003/health/live
          curl -sf http://localhost:3000/ -o /dev/null
          echo "smoke OK"

      # Денежный путь: кампания → рекомендация → accept → Avro-транзакция
      # в Kafka (localhost:9094, Schema Registry localhost:8081) →
      # начисление в Postgres. Пропуск теста здесь — тоже провал.
      - name: E2E money path (make test-e2e)
        env:
          PYTEST_ADDOPTS: -rs --junitxml=${{ github.workspace }}/e2e-junit.xml
        run: |
          make test-e2e
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("e2e-junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"e2e: tests={total} skipped={skipped}")
          if total == 0 or skipped:
              sys.exit("e2e money path did not run to completion (skipped or not collected)")
          EOF

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps -a
          df -h /
          docker compose logs --tail 200
          # «container is unhealthy» сам по себе ничего не объясняет:
          # Health.Log — вывод последних проб healthcheck (ошибку wget видно
          # и с -q) каждого контейнера, который так и не стал healthy.
          for c in $(docker compose ps -a --format '{{.Name}}'); do
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$c")
            if [ -n "$health" ] && [ "$health" != healthy ]; then
              echo "::group::$c: healthcheck $health"
              docker inspect --format '{{json .State.Health}}' "$c" | python3 -m json.tool
              echo "::endgroup::"
            fi
          done
          # ClickHouse пишет свои логи в файлы на томе clickhouse-logs, в
          # stdout после init ничего нет.
          if docker inspect cashback-clickhouse >/dev/null 2>&1; then
            for f in clickhouse-server.err.log clickhouse-server.log; do
              echo "::group::cashback-clickhouse: $f (last 300 lines)"
              docker cp "cashback-clickhouse:/var/log/clickhouse-server/$f" - | tar -xO | tail -n 300
              echo "::endgroup::"
            done
          fi
