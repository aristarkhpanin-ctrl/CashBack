# =====================================================================
# CashBack — main CI/CD pipeline
#
# Stages (chapter 3.3, listing 3.16):
#
#   1. lint-and-type — ruff + ruff format + mypy + frontend lint/tsc   ≤ 60 s
#   2. unit          — per-service unit tests + coverage gate (matrix,
#                      one clean environment per service)
#      integration   — repo-level tests/integration (testcontainers)
#   3. build         — build & push docker images to GHCR
#                      (push to the repository's default branch only)
#   4. deploy        — placeholder for `helm upgrade --install`
# =====================================================================

name: CI

# CI не привязан к имени ветки (default-ветка репозитория — не `main`):
# push в любую ветку и любой PR; build/deploy — только default-ветка.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NB: no PIP_NO_CACHE_DIR here — with it `pip cache dir` exits 1 and
# actions/setup-python (`cache: pip`) fails in every Python job.
env:
  PYTHONDONTWRITEBYTECODE: "1"
  REGISTRY: ghcr.io

jobs:
  # =====================================================================
  # 1) lint-and-type — Python lint/format/mypy across 3.11+3.12,
  #     plus frontend lint + tsc --noEmit. Target: ≤60 s.
  # =====================================================================
  lint-and-type:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install \
            "ruff==0.6.9" \
            "mypy==1.11.2"

      - name: Ruff lint
        run: ruff check services scripts tests db_migrations

      - name: Ruff format check
        run: ruff format --check services scripts tests db_migrations
        continue-on-error: true   # not yet enforced repo-wide

      - name: Mypy (best-effort, non-blocking)
        run: |
          for svc in services/*/app; do
            echo ">>> mypy $svc"
            mypy --ignore-missing-imports --no-strict-optional \
                 --show-error-codes --pretty "$svc" || true
          done

      - name: Set up Node 20
        if: matrix.python-version == '3.11'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint + tsc
        if: matrix.python-version == '3.11'
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint --if-present || true
          npx tsc --noEmit -p tsconfig.app.json

  # =====================================================================
  # 2) unit — каждый сервис в своём чистом окружении (matrix): зависимости
  #    сервисов несовместимы между собой (etl/Airflow, тяжёлый rec_api),
  #    поэтому общий venv + `make test-unit` маскировал ошибки установки.
  #    Порог покрытия — fail_under из pyproject.toml сервиса.
  # =====================================================================
  unit:
    name: Unit tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint-and-type]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - etl
          - recommendation_api
          - campaign_manager
          - transaction_listener
          - mobile_api
          - ml_training
          - tx_simulator
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            services/${{ matrix.service }}/pyproject.toml
            services/${{ matrix.service }}/requirements.lock

      - name: Install ${{ matrix.service }} with dev extras
        run: |
          python -m pip install --upgrade pip
          # Закреплённые версии (lock) ставятся первыми, если сервис их ведёт.
          if [ -f "services/${{ matrix.service }}/requirements.lock" ]; then
            pip install -r "services/${{ matrix.service }}/requirements.lock"
          fi
          pip install -e "services/${{ matrix.service }}[dev]"

      - name: Unit tests with coverage gate
        working-directory: services/${{ matrix.service }}
        run: >-
          python -m pytest tests/ -q -m "not integration"
          --cov-config=pyproject.toml --cov
          --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: services/${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}
          fail_ci_if_error: false
          token: ${{ env.CODECOV_TOKEN }}

  # =====================================================================
  # 2a) integration — repo-level tests/integration: testcontainers
  #     (Postgres/Redis) на Docker раннера + пакеты `app` сервисов,
  #     которые эти тесты импортируют (rec_api, transaction_listener, etl).
  # =====================================================================
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [lint-and-type]
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            tests/requirements-integration.txt
            services/recommendation_api/pyproject.toml
            services/recommendation_api/requirements.lock
            services/transaction_listener/pyproject.toml
            services/etl/pyproject.toml

      - name: Install integration test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f services/recommendation_api/requirements.lock ]; then
            pip install -r services/recommendation_api/requirements.lock
          fi
          pip install \
            -e services/recommendation_api \
            -e services/transaction_listener \
            -e services/etl
          if [ -f tests/requirements-integration.txt ]; then
            pip install -r tests/requirements-integration.txt
          else
            pip install pytest pytest-asyncio pytest-timeout \
              "testcontainers[postgres,redis]"
          fi

      - name: Run integration tests
        run: make test-integration

  # =====================================================================
  # 2b) frontend-e2e — Playwright: продакшен-бандл в demo- и live-режимах
  #     (live — против stub-бэкенда, повторяющего wire-формат сервисов;
  #      контракт стаба зафиксирован pydantic-тестами в unit (campaign_manager)).
  # =====================================================================
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [lint-and-type]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps + build production bundle
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run E2E (demo + live vs stub backend)
        working-directory: frontend
        run: npx playwright test

      - name: Upload traces and report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e-report/
            frontend/test-results/
          retention-days: 7

  # =====================================================================
  # 2c) api-types-drift — TS-типы генерируются из OpenAPI campaign_manager;
  #     рассинхрон схемы (правка schemas.py без регенерации) роняет CI.
  # =====================================================================
  api-types-drift:
    name: OpenAPI → TS types drift
    runs-on: ubuntu-latest
    needs: [lint-and-type]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps for offline OpenAPI dump
        run: |
          python -m pip install --upgrade pip
          # campaign_manager base deps + pandas (rec_api schema import);
          # faiss/tenacity/mlflow/shap are stubbed by scripts/dump_openapi.py.
          pip install -e services/campaign_manager
          pip install "pandas>=2.1.0"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Regenerate OpenAPI-derived TS types
        run: make gen-api-types

      - name: Fail if generated types drifted from the committed schema
        run: |
          if ! git diff --exit-code -- frontend/src/shared/api/generated/; then
            echo "::error::OpenAPI types are stale. Run 'make gen-api-types' and commit the result."
            exit 1
          fi

  # =====================================================================
  # 3) build — multi-stage docker images for every service + frontend,
  #     pushed to GHCR with both `latest` and the git SHA as tags.
  #     Runs only on push to the repository's default branch; needs no
  #     secrets beyond the built-in GITHUB_TOKEN.
  # =====================================================================
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [unit, integration, frontend-e2e, api-types-drift]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component:
          - { name: recommendation-api,    context: services/recommendation_api }
          - { name: campaign-manager,      context: services/campaign_manager }
          - { name: transaction-listener,  context: services/transaction_listener }
          - { name: mobile-api,            context: services/mobile_api }
          - { name: etl,                   context: services/etl }
          - { name: ml-training,           context: services/ml_training }
          - { name: tx-simulator,          context: services/tx_simulator }
          - { name: frontend,              context: frontend }

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository slug
        id: repo
        run: echo "slug=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.component.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          push: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to:   type=gha,scope=${{ matrix.component.name }},mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.slug }}/${{ matrix.component.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.slug }}/${{ matrix.component.name }}:${{ github.sha }}

  # =====================================================================
  # 4) deploy — placeholder demonstrating where the OIDC-authenticated
  #     `helm upgrade --install` would run in a commercial environment.
  # =====================================================================
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: production
      url: https://cashback.example.com
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository slug
        id: repo
        run: echo "slug=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Show planned deploy
        run: |
          cat <<EOF
          === Production deployment plan ===
          Commit:   ${{ github.sha }}
          Registry: ${{ env.REGISTRY }}/${{ steps.repo.outputs.slug }}
          Services: recommendation-api, campaign-manager, transaction-listener,
                    mobile-api, etl, ml-training, tx-simulator, frontend

          Would run:
            helm upgrade --install cashback ./helm/cashback \\
              --namespace cashback --create-namespace \\
              --set image.tag=${{ github.sha }} \\
              --atomic --wait --timeout 10m

          (In a commercial deployment, OIDC would be used here:
            uses: aws-actions/configure-aws-credentials@v4
            with: { role-to-assume: \${{ secrets.AWS_ROLE_ARN }}, aws-region: ... }
          followed by: aws eks update-kubeconfig …
          and the helm upgrade above.)
          EOF
