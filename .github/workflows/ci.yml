# =====================================================================
# CashBack — main CI/CD pipeline
#
# Stages (chapter 3.3, listing 3.16):
#
#   1. lint-and-type — ruff + ruff format + mypy + frontend lint/tsc   ≤ 60 s
#   2. unit          — per-service unit tests + coverage gate (matrix,
#                      one clean environment per service)
#      integration   — repo-level tests/integration (testcontainers)
#      service-integration — mobile_api / ml_training / etl /
#                      recommendation_api / campaign_manager /
#                      transaction_listener integration suites +
#                      db_migrations/tests (SQL money rules, migration 009)
#      (integration jobs run with a fresh random set of JWT_SECRET /
#       SERVICE_JWT_SECRET / MOBILE_JWT_SECRET: stage B, ADR-0013)
#   3. build         — build & push docker images to GHCR
#                      (push to the repository's default branch only)
#   4. deploy        — placeholder for `helm upgrade --install`
# =====================================================================

name: CI

# CI не привязан к имени ветки (default-ветка репозитория — не `main`):
# push в любую ветку; build/deploy — только default-ветка.
# Это единственный pipeline: PR из веток этого репозитория уже проверены
# push-прогоном того же коммита (его статусы видны в PR), поэтому
# pull_request-прогон нужен только PR из форков (lint-and-type ниже
# пропускает остальные, а за ним и все зависимые джобы). Раньше один
# коммит в ветке с открытым PR гонял unit-матрицу трижды: ci.yml (push),
# ci.yml (pull_request) и pr.yml.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NB: no PIP_NO_CACHE_DIR here — with it `pip cache dir` exits 1 and
# actions/setup-python (`cache: pip`) fails in every Python job.
env:
  PYTHONDONTWRITEBYTECODE: "1"
  REGISTRY: ghcr.io

jobs:
  # =====================================================================
  # 1) lint-and-type — Python lint/format/mypy across 3.11+3.12,
  #     plus frontend lint + tsc --noEmit. Target: ≤60 s.
  # =====================================================================
  lint-and-type:
    name: Lint & type check
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install \
            "ruff==0.6.9" \
            "mypy==1.11.2"

      - name: Ruff lint
        run: ruff check services scripts tests db_migrations

      - name: Ruff format check
        run: ruff format --check services scripts tests db_migrations
        continue-on-error: true   # not yet enforced repo-wide

      - name: Mypy (best-effort, non-blocking)
        run: |
          for svc in services/*/app; do
            echo ">>> mypy $svc"
            mypy --ignore-missing-imports --no-strict-optional \
                 --show-error-codes --pretty "$svc" || true
          done

      - name: Set up Node 20
        if: matrix.python-version == '3.11'
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint + tsc
        if: matrix.python-version == '3.11'
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint --if-present || true
          npx tsc --noEmit -p tsconfig.app.json

  # =====================================================================
  # 2) unit — каждый сервис в своём чистом окружении (matrix): зависимости
  #    сервисов несовместимы между собой (etl/Airflow, тяжёлый rec_api),
  #    поэтому общий venv + `make test-unit` маскировал ошибки установки.
  #    Порог покрытия — fail_under из pyproject.toml сервиса.
  # =====================================================================
  unit:
    name: Unit tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint-and-type]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - etl
          - recommendation_api
          - campaign_manager
          - transaction_listener
          - mobile_api
          - ml_training
          - tx_simulator
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            services/${{ matrix.service }}/pyproject.toml
            services/${{ matrix.service }}/requirements.lock
            services/${{ matrix.service }}/requirements-dev.lock

      - name: Install ${{ matrix.service }} with dev extras
        run: |
          python -m pip install --upgrade pip
          # Закреплённые версии ставятся первыми, если сервис их ведёт:
          # requirements-dev.lock пинует и тестовый инструментарий
          # (pytest, pytest-asyncio, …), requirements.lock — только рантайм.
          svc="services/${{ matrix.service }}"
          if [ -f "$svc/requirements-dev.lock" ]; then
            pip install -r "$svc/requirements-dev.lock"
          elif [ -f "$svc/requirements.lock" ]; then
            pip install -r "$svc/requirements.lock"
          fi
          pip install -e "${svc}[dev]"

      - name: Unit tests with coverage gate
        working-directory: services/${{ matrix.service }}
        run: >-
          python -m pytest tests/ -q -m "not integration"
          --cov-config=pyproject.toml --cov
          --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: services/${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}
          fail_ci_if_error: false
          token: ${{ env.CODECOV_TOKEN }}

  # =====================================================================
  # 2a) integration — repo-level tests/integration: testcontainers
  #     на Docker раннера + пакеты `app` сервисов, которые эти тесты
  #     импортируют (rec_api, transaction_listener, etl).
  #     Пропущенный тест — провал джобы: skip из-за недоставленной
  #     зависимости или недоступного Docker ничего не проверил. Осознанно
  #     допустимый skip перечисляется в ALLOWED_SKIPS (регулярное
  #     выражение по строке «SKIPPED [n] file:line: reason»; пусто — ни
  #     один). Модуль без выбранных тестов pytest завершает с кодом 5 —
  #     это провал и без проверки ниже.
  # =====================================================================
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [lint-and-type]
    timeout-minutes: 25
    env:
      ALLOWED_SKIPS: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            tests/requirements-integration.txt
            services/recommendation_api/pyproject.toml
            services/recommendation_api/requirements.lock
            services/transaction_listener/pyproject.toml
            services/etl/pyproject.toml

      # Порядок — как в tests/requirements-integration.txt: пакеты сервисов
      # (rec_api — из своего lock), затем зависимости самих тестов.
      - name: Install integration test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/recommendation_api/requirements.lock
          pip install \
            -e services/recommendation_api \
            -e services/transaction_listener \
            -e services/etl
          pip install -r tests/requirements-integration.txt

      # Stage B (ADR-0013): no fixed keys in the repo or in this file. A
      # fresh random set per run; the test conftests take it from the
      # environment (os.environ.setdefault) instead of their fallbacks.
      - name: Generate per-run secrets
        run: |
          for key in JWT_SECRET SERVICE_JWT_SECRET MOBILE_JWT_SECRET; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done

      # make test-integration — отдельный pytest на каждый модуль; модуль
      # без единого выбранного теста завершается с кодом 5 и роняет цель,
      # а пропуски (exit 0) видны только в сводке `-rs`: её разбирает
      # следующий шаг. PYTEST_ADDOPTS — чтобы сводка была и без -rs в
      # Makefile.
      - name: Run integration tests
        env:
          PYTEST_ADDOPTS: -rs
        run: |
          set -o pipefail
          make test-integration 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      - name: Fail on skipped integration tests
        run: |
          python3 - "$RUNNER_TEMP/pytest.log" <<'EOF'
          import os
          import re
          import sys

          allowed = os.environ.get("ALLOWED_SKIPS", "")
          with open(sys.argv[1], encoding="utf-8", errors="replace") as log:
              skipped = [line.rstrip() for line in log if line.startswith("SKIPPED [")]
          bad = [line for line in skipped if not (allowed and re.search(allowed, line))]
          print(f"skipped: {len(skipped)}, not allowed: {len(bad)}")
          for line in bad:
              print(f"::error::{line}")
          sys.exit(1 if bad else 0)
          EOF

  # =====================================================================
  # 2b) service-integration — интеграционные наборы сервисов, которые
  #     unit-гейт (-m "not integration") не запускает: mobile_api (B13,
  #     отклик на оффер на реальном Postgres/Redis через testcontainers;
  #     B12 — customer-токены), ml_training (B44, SQL загрузчика обучения
  #     на схеме alembic head; фикстура сама мигрирует ML_IT_POSTGRES_DSN),
  #     etl (B43, задачи DAG на реальных Kafka / Schema Registry /
  #     ClickHouse: коммит офсетов после загрузки, сбой Schema Registry,
  #     карантин строк; стенд поднимает services/etl/tests/integration/
  #     stack.sh), recommendation_api (B27: /explain не пишет ни строк,
  #     ни событий Kafka, ни ключей Redis — testcontainers Postgres /
  #     Redis / Kafka) и campaign_manager (B20: миграции 002/008 —
  #     случайный и операторский пароль bootstrap-админа, замена старого
  #     admin/admin, downgrade — на Postgres джоба; этап C: деньги кампаний
  #     B24/B25/B38/B23/B26/B22/B39 на схеме head + testcontainers-Redis),
  #     transaction_listener (этап C, B45: одноразовый оффер, retry/seek/DLQ,
  #     сбой Postgres посреди пачки, дневной лимит при параллельных покупках
  #     — на Postgres джоба в схеме head + testcontainers Redis / Kafka /
  #     Schema Registry) и db_migrations/tests (миграция 009: каждое правило
  #     eligible_campaigns / calculate_cashback / триггера статусов / журнала
  #     начислений и upgrade → downgrade → upgrade). Пропуск — провал,
  #     как в integration.
  # =====================================================================
  service-integration:
    name: Service integration (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint-and-type]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - mobile_api
          - ml_training
          - etl
          - recommendation_api
          - campaign_manager
          - transaction_listener
          - db_migrations
        include:
          # campaign_manager: миграции (B20), гонка сброса/смены пароля
          # (B35) и деньги кампаний (этап C) на настоящем Postgres. Его
          # test_campaigns_crud.py сломан ещё до stage B (фикстура без
          # lifespan, самописная схема) и в CI не входил никогда. psycopg2 —
          # драйвер db_migrations/env.py, его нет в [dev].
          - service: campaign_manager
            tests: >-
              tests/integration/test_auth_migrations.py
              tests/integration/test_auth_races.py
              tests/integration/test_money_integrity.py
            extra_deps: psycopg2-binary==2.9.13
          # transaction_listener: набор сам мигрирует свою БД до head
          # (db_migrations/env.py — alembic + psycopg2, их нет в [dev]).
          - service: transaction_listener
            extra_deps: alembic==1.20.0 psycopg2-binary==2.9.13
          # db_migrations — не пакет: закреплённые зависимости тестов
          # миграций (без pytest-cov), тесты — db_migrations/tests.
          - service: db_migrations
            path: db_migrations
            requirements: db_migrations/tests/requirements.txt
            tests: tests
            pytest_args: -m integration
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cashback
          POSTGRES_PASSWORD: cashback
          POSTGRES_DB: cashback
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashback -d cashback"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ML_IT_POSTGRES_DSN: postgresql://cashback:cashback@localhost:5432/cashback
      # Сервер с правом CREATEDB: каждый тест миграций — своя свежая БД.
      CM_IT_POSTGRES_DSN: postgresql://cashback:cashback@localhost:5432/postgres
      # Суперпользователь сервиса postgres: наборы создают и удаляют свои БД,
      # transaction_listener ещё и «роняет» свою (ALLOW_CONNECTIONS false +
      # pg_terminate_backend) — сбой Postgres посреди пачки. Redis / Kafka /
      # Schema Registry listener-набор поднимает сам (testcontainers).
      LISTENER_IT_POSTGRES_DSN: postgresql://cashback:cashback@localhost:5432/postgres
      MIGRATIONS_IT_POSTGRES_DSN: postgresql://cashback:cashback@localhost:5432/postgres
      ALLOWED_SKIPS: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            ${{ matrix.path || format('services/{0}', matrix.service) }}/pyproject.toml
            ${{ matrix.path || format('services/{0}', matrix.service) }}/requirements-dev.lock
            ${{ matrix.requirements || format('services/{0}/pyproject.toml', matrix.service) }}

      # Как в unit: закреплённые версии первыми, если сервис их ведёт
      # (recommendation_api — без lock pip не разрешает его зависимости, B5).
      # Набор без пакета (db_migrations) ставит только свои requirements.
      - name: Install ${{ matrix.service }} test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ matrix.requirements }}" ]; then
            pip install -r "${{ matrix.requirements }}"
            exit 0
          fi
          svc="services/${{ matrix.service }}"
          if [ -f "$svc/requirements-dev.lock" ]; then
            pip install -r "$svc/requirements-dev.lock"
          fi
          pip install -e "${svc}[dev]" ${{ matrix.extra_deps }}

      # Stage B (ADR-0013): no fixed keys in the repo or in this file. A
      # fresh random set per run; the test conftests take it from the
      # environment (os.environ.setdefault) instead of their fallbacks.
      - name: Generate per-run secrets
        run: |
          for key in JWT_SECRET SERVICE_JWT_SECRET MOBILE_JWT_SECRET; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done

      # ETL_IT_* для tests/integration/test_real_pipeline.py.
      - name: Start Kafka, Schema Registry and ClickHouse (etl)
        if: matrix.service == 'etl'
        run: |
          bash services/etl/tests/integration/stack.sh up
          bash services/etl/tests/integration/stack.sh env >> "$GITHUB_ENV"

      - name: Run ${{ matrix.service }} integration tests
        working-directory: ${{ matrix.path || format('services/{0}', matrix.service) }}
        run: |
          set -o pipefail
          python -m pytest ${{ matrix.tests || 'tests/integration' }} \
            -q ${{ matrix.pytest_args || '-m integration --no-cov' }} -rs 2>&1 \
            | tee "$RUNNER_TEMP/pytest.log"

      - name: Fail on skipped integration tests
        run: |
          python3 - "$RUNNER_TEMP/pytest.log" <<'EOF'
          import os
          import re
          import sys

          allowed = os.environ.get("ALLOWED_SKIPS", "")
          with open(sys.argv[1], encoding="utf-8", errors="replace") as log:
              skipped = [line.rstrip() for line in log if line.startswith("SKIPPED [")]
          bad = [line for line in skipped if not (allowed and re.search(allowed, line))]
          print(f"skipped: {len(skipped)}, not allowed: {len(bad)}")
          for line in bad:
              print(f"::error::{line}")
          sys.exit(1 if bad else 0)
          EOF

      - name: Stop the ETL stack
        if: always() && matrix.service == 'etl'
        run: bash services/etl/tests/integration/stack.sh down

  # =====================================================================
  # 2c) frontend-e2e — Playwright: продакшен-бандл в demo- и live-режимах
  #     (live — против stub-бэкенда, повторяющего wire-формат сервисов;
  #      контракт стаба зафиксирован pydantic-тестами в unit (campaign_manager)).
  # =====================================================================
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [lint-and-type]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps + build production bundle
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run E2E (demo + live vs stub backend)
        working-directory: frontend
        run: npx playwright test

      - name: Upload traces and report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e-report/
            frontend/test-results/
          retention-days: 7

  # =====================================================================
  # 2d) api-types-drift — TS-типы генерируются из OpenAPI campaign_manager;
  #     рассинхрон схемы (правка schemas.py без регенерации) роняет CI.
  # =====================================================================
  api-types-drift:
    name: OpenAPI → TS types drift
    runs-on: ubuntu-latest
    needs: [lint-and-type]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps for offline OpenAPI dump
        run: |
          python -m pip install --upgrade pip
          # campaign_manager base deps + pandas (rec_api schema import);
          # faiss/tenacity/mlflow/shap are stubbed by scripts/dump_openapi.py.
          # The libraries that shape the schema are pinned to the versions
          # the committed generated/ files were produced with: a new release
          # changes the dump by itself (pydantic 2.14 dropped `pattern` from
          # Decimal fields) and would turn this job red with no repo change.
          # Bump them together with a `make gen-api-types` commit.
          pip install -e services/campaign_manager \
            "fastapi==0.115.14" "starlette==0.46.2" "pydantic==2.14.1"
          pip install "pandas>=2.1.0"

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Regenerate OpenAPI-derived TS types
        run: make gen-api-types

      - name: Fail if generated types drifted from the committed schema
        run: |
          if ! git diff --exit-code -- frontend/src/shared/api/generated/; then
            echo "::error::OpenAPI types are stale. Run 'make gen-api-types' and commit the result."
            exit 1
          fi

  # =====================================================================
  # 3) build — multi-stage docker images for every service + frontend,
  #     pushed to GHCR with both `latest` and the git SHA as tags.
  #     Runs only on push to the repository's default branch; needs no
  #     secrets beyond the built-in GITHUB_TOKEN.
  # =====================================================================
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [unit, integration, service-integration, frontend-e2e, api-types-drift]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component:
          - { name: recommendation-api,    context: services/recommendation_api }
          - { name: campaign-manager,      context: services/campaign_manager }
          - { name: transaction-listener,  context: services/transaction_listener }
          - { name: mobile-api,            context: services/mobile_api }
          - { name: etl,                   context: services/etl }
          - { name: ml-training,           context: services/ml_training }
          - { name: tx-simulator,          context: services/tx_simulator }
          - { name: frontend,              context: frontend }

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository slug
        id: repo
        run: echo "slug=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.component.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          push: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to:   type=gha,scope=${{ matrix.component.name }},mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.slug }}/${{ matrix.component.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.slug }}/${{ matrix.component.name }}:${{ github.sha }}

  # =====================================================================
  # 4) deploy — placeholder demonstrating where the OIDC-authenticated
  #     `helm upgrade --install` would run in a commercial environment.
  # =====================================================================
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: production
      url: https://cashback.example.com
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository slug
        id: repo
        run: echo "slug=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Show planned deploy
        run: |
          cat <<EOF
          === Production deployment plan ===
          Commit:   ${{ github.sha }}
          Registry: ${{ env.REGISTRY }}/${{ steps.repo.outputs.slug }}
          Services: recommendation-api, campaign-manager, transaction-listener,
                    mobile-api, etl, ml-training, tx-simulator, frontend

          Would run:
            helm upgrade --install cashback ./helm/cashback \\
              --namespace cashback --create-namespace \\
              --set image.tag=${{ github.sha }} \\
              --atomic --wait --timeout 10m

          (In a commercial deployment, OIDC would be used here:
            uses: aws-actions/configure-aws-credentials@v4
            with: { role-to-assume: \${{ secrets.AWS_ROLE_ARN }}, aws-region: ... }
          followed by: aws eks update-kubeconfig …
          and the helm upgrade above.)
          EOF
