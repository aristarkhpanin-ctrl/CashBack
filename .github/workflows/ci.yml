# =====================================================================
# CashBack — main CI/CD pipeline
#
# Stages (chapter 3.3, listing 3.16):
#
#   1. lint-and-type — ruff + ruff format + mypy + frontend lint/tsc   ≤ 60 s
#   2. test          — unit + integration tests with coverage          ≤ 5 min
#   3. build         — build & push docker images to GHCR (push to main)
#   4. deploy        — placeholder for `helm upgrade --install`
# =====================================================================

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_NO_CACHE_DIR: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  REGISTRY: ghcr.io

jobs:
  # =====================================================================
  # 1) lint-and-type — Python lint/format/mypy across 3.11+3.12,
  #     plus frontend lint + tsc --noEmit. Target: ≤60 s.
  # =====================================================================
  lint-and-type:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install \
            "ruff==0.6.9" \
            "mypy==1.11.2"

      - name: Ruff lint
        run: ruff check services scripts tests db_migrations

      - name: Ruff format check
        run: ruff format --check services scripts tests db_migrations
        continue-on-error: true   # not yet enforced repo-wide

      - name: Mypy (best-effort, non-blocking)
        run: |
          for svc in services/*/app; do
            echo ">>> mypy $svc"
            mypy --ignore-missing-imports --no-strict-optional \
                 --show-error-codes --pretty "$svc" || true
          done

      - name: Set up Node 20
        if: matrix.python-version == '3.11'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint + tsc
        if: matrix.python-version == '3.11'
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint --if-present || true
          npx tsc --noEmit -p tsconfig.app.json

  # =====================================================================
  # 2) test — unit + integration with coverage upload.
  # =====================================================================
  test:
    name: Unit + Integration tests
    runs-on: ubuntu-latest
    needs: [lint-and-type]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pytest tooling
        run: |
          python -m pip install --upgrade pip
          pip install \
            "pytest==8.3.3" \
            "pytest-asyncio==0.23.8" \
            "pytest-cov==5.0.0" \
            "pytest-timeout==2.3.1" \
            "fakeredis==2.24.1"

      - name: Install per-service runtime + dev deps
        run: |
          set -e
          for svc in services/recommendation_api services/campaign_manager \
                     services/transaction_listener services/mobile_api \
                     services/etl services/ml_training services/tx_simulator; do
            echo "::group::install $svc"
            (cd "$svc" && pip install -e ".[dev]") || \
              echo "::warning::could not fully install $svc — tests may skip"
            echo "::endgroup::"
          done

      - name: Run unit tests with coverage gates
        run: make test-unit

      - name: Run integration tests
        run: make test-integration

      - name: Aggregate coverage XML
        if: always()
        run: |
          python -m pip install "coverage==7.6.1"
          python -m coverage combine \
            services/etl/.coverage \
            services/recommendation_api/.coverage \
            services/campaign_manager/.coverage \
            services/transaction_listener/.coverage \
            services/mobile_api/.coverage \
            services/ml_training/.coverage \
            services/tx_simulator/.coverage 2>/dev/null || true
          python -m coverage xml -o coverage.xml || true

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: services
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage.xml
            services/*/.coverage
          retention-days: 7

  # =====================================================================
  # 3) build — multi-stage docker images for every service + frontend,
  #     pushed to GHCR with both `latest` and the git SHA as tags.
  #     Runs only on push to `main`.
  # =====================================================================
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component:
          - { name: recommendation-api,    context: services/recommendation_api }
          - { name: campaign-manager,      context: services/campaign_manager }
          - { name: transaction-listener,  context: services/transaction_listener }
          - { name: mobile-api,            context: services/mobile_api }
          - { name: etl,                   context: services/etl }
          - { name: ml-training,           context: services/ml_training }
          - { name: tx-simulator,          context: services/tx_simulator }
          - { name: frontend,              context: frontend }

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository slug
        id: repo
        run: echo "slug=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.component.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          push: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to:   type=gha,scope=${{ matrix.component.name }},mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.slug }}/${{ matrix.component.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.slug }}/${{ matrix.component.name }}:${{ github.sha }}

  # =====================================================================
  # 4) deploy — placeholder demonstrating where the OIDC-authenticated
  #     `helm upgrade --install` would run in a commercial environment.
  # =====================================================================
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://cashback.example.com
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository slug
        id: repo
        run: echo "slug=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Show planned deploy
        run: |
          cat <<EOF
          === Production deployment plan ===
          Commit:   ${{ github.sha }}
          Registry: ${{ env.REGISTRY }}/${{ steps.repo.outputs.slug }}
          Services: recommendation-api, campaign-manager, transaction-listener,
                    mobile-api, etl, ml-training, tx-simulator, frontend

          Would run:
            helm upgrade --install cashback ./helm/cashback \\
              --namespace cashback --create-namespace \\
              --set image.tag=${{ github.sha }} \\
              --atomic --wait --timeout 10m

          (In a commercial deployment, OIDC would be used here:
            uses: aws-actions/configure-aws-credentials@v4
            with: { role-to-assume: \${{ secrets.AWS_ROLE_ARN }}, aws-region: ... }
          followed by: aws eks update-kubeconfig …
          and the helm upgrade above.)
          EOF
