# =====================================================================
# PR pipeline — fast feedback loop for pull requests.
#
# Limited to lint + unit tests so the PR author gets a quick verdict;
# integration tests run from `ci.yml` (push to any branch and PRs),
# build / deploy — from `ci.yml` on pushes to the default branch.
# =====================================================================

name: PR

# Любой PR, независимо от целевой ветки (default-ветка — не `main`).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff
        run: pip install "ruff==0.6.9"

      - name: Ruff lint
        run: ruff check services scripts tests db_migrations

      - name: Ruff format check
        run: ruff format --check services scripts tests db_migrations
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint + tsc
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint --if-present || true
          npx tsc --noEmit -p tsconfig.app.json

  # Каждый сервис — в своём чистом окружении (как unit-джоба в ci.yml).
  unit:
    name: Unit tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - etl
          - recommendation_api
          - campaign_manager
          - transaction_listener
          - mobile_api
          - ml_training
          - tx_simulator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            services/${{ matrix.service }}/pyproject.toml
            services/${{ matrix.service }}/requirements.lock

      - name: Install ${{ matrix.service }} with dev extras
        run: |
          python -m pip install --upgrade pip
          if [ -f "services/${{ matrix.service }}/requirements.lock" ]; then
            pip install -r "services/${{ matrix.service }}/requirements.lock"
          fi
          pip install -e "services/${{ matrix.service }}[dev]"

      - name: Unit tests with coverage gate
        working-directory: services/${{ matrix.service }}
        run: >-
          python -m pytest tests/ -q -m "not integration"
          --cov-config=pyproject.toml --cov
