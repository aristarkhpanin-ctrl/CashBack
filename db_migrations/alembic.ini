# =====================================================================
# Alembic configuration for CashBack OLTP schema (PostgreSQL).
# DSN can be overridden via the POSTGRES_DSN environment variable;
# `migrations/env.py` reads it at runtime.
# =====================================================================

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
timezone = UTC
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60

# Default DSN (used when POSTGRES_DSN is not set).
sqlalchemy.url = postgresql+psycopg2://cashback:cashback@localhost:5432/cashback


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
