# =====================================================================
# nginx config for the static frontend bundle.
#
# Proxies under /api/{recommendations,campaigns,mobile} → upstream
# FastAPI services. Strips the prefix so each service sees its own
# routes (`/recommendations/...`, `/campaigns/...`, `/v1/mobile/...`).
# =====================================================================

worker_processes  1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript application/xml text/xml application/x-javascript;

    upstream recommendation_api { server recommendation-api:8001; }
    upstream campaign_api       { server campaign-manager:8002; }
    upstream mobile_api         { server mobile-api:8003; }

    server {
        listen       3000;
        server_name  _;

        # Static SPA bundle.
        root   /usr/share/nginx/html;
        index  index.html;

        # ---- API proxies ------------------------------------------------
        location /api/recommendations/ {
            rewrite ^/api/recommendations/(.*)$ /$1 break;
            proxy_pass         http://recommendation_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location /api/campaigns/ {
            rewrite ^/api/campaigns/(.*)$ /$1 break;
            proxy_pass         http://campaign_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location /api/mobile/ {
            rewrite ^/api/mobile/(.*)$ /$1 break;
            proxy_pass         http://mobile_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ---- SPA fallback ------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache hashed assets aggressively.
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}
