# =====================================================================
# CashBack — local infrastructure stack
#
#   make up      to start
#   make config  to validate
#   make clean   to wipe volumes
# =====================================================================

name: cashback

networks:
  cashback-net:
    driver: bridge

volumes:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
  redis-data:
  kafka-data:
  mlflow-artifacts:
  mlflow-db:
  airflow-logs:
  etl-staging:
  tx-simulator-data:
  ml-artifacts:
  recommendation-api-cache:

services:

  # -------------------------------------------------------------------
  # PostgreSQL 16 — operational store + Airflow/MLflow metastores
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cashback-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cashback}
      POSTGRES_USER: ${POSTGRES_USER:-cashback}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cashback}
      AIRFLOW_POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW_POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:-airflow}
      AIRFLOW_POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow}
      MLFLOW_POSTGRES_DB: ${MLFLOW_POSTGRES_DB:-mlflow}
      MLFLOW_POSTGRES_USER: ${MLFLOW_POSTGRES_USER:-mlflow}
      MLFLOW_POSTGRES_PASSWORD: ${MLFLOW_POSTGRES_PASSWORD:-mlflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cashback} -d ${POSTGRES_DB:-cashback}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cashback-net

  # -------------------------------------------------------------------
  # ClickHouse 24 — analytical store
  # -------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: cashback-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-cashback}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-cashback}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-cashback}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./infrastructure/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cashback-net

  # -------------------------------------------------------------------
  # Redis 7.2 — cache / feature store
  # -------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: cashback-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - cashback-net

  # -------------------------------------------------------------------
  # Apache Kafka 3.7 — KRaft single-node, no ZooKeeper
  # -------------------------------------------------------------------
  kafka:
    image: bitnami/kafka:3.7
    container_name: cashback-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # KRaft node configuration
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Listeners: INTERNAL (in-network), CONTROLLER (KRaft), EXTERNAL (host)
      KAFKA_CFG_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      # Single-node defaults
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - cashback-net

  # -------------------------------------------------------------------
  # Confluent Schema Registry — Avro/JSON-schema registry
  # -------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: cashback-schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
    networks:
      - cashback-net

  # -------------------------------------------------------------------
  # MLflow Tracking Server 2.13 — sqlite backend, local artifact volume
  # -------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: cashback-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - mlflow-db:/mlflow/db
      - mlflow-artifacts:/mlflow/artifacts
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/db/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
    networks:
      - cashback-net

  # -------------------------------------------------------------------
  # Apache Airflow 2.9 — webserver, scheduler, init
  # -------------------------------------------------------------------
  airflow-init:
    build:
      context: ./services/etl
      dockerfile: Dockerfile
    image: airflow/etl:0.1
    container_name: cashback-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-LocalExecutor}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES:-False}
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@postgres:5432/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-please-change-me}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
      PYTHONPATH: /opt/etl
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_TOPIC_TRANSACTIONS: ${KAFKA_TOPIC_TRANSACTIONS:-transactions.raw}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-cashback-etl-group}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-cashback}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-cashback}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-cashback}
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-cashback}:${POSTGRES_PASSWORD:-cashback}@postgres:5432/${POSTGRES_DB:-cashback}
      STAGING_DIR: /data/staging
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@cashback.local}
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --role Admin \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
          --email    "$${_AIRFLOW_WWW_USER_EMAIL}" \
          --firstname Admin --lastname User || true
    volumes:
      - ./services/etl/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      - etl-staging:/data
    networks:
      - cashback-net

  airflow-webserver:
    image: airflow/etl:0.1
    container_name: cashback-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment: *airflow-env
    user: "${AIRFLOW_UID:-50000}:0"
    command: webserver
    ports:
      - "8080:8080"
    volumes:
      - ./services/etl/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      - etl-staging:/data
    networks:
      - cashback-net

  airflow-scheduler:
    image: airflow/etl:0.1
    container_name: cashback-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: *airflow-env
    user: "${AIRFLOW_UID:-50000}:0"
    command: scheduler
    volumes:
      - ./services/etl/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      - etl-staging:/data
    networks:
      - cashback-net

  # Optional CeleryExecutor worker — enabled via `--profile celery`.
  # Under the default LocalExecutor profile the scheduler runs tasks
  # itself and this service is not started. Switching profiles also
  # requires AIRFLOW__CORE__EXECUTOR=CeleryExecutor and a broker URL.
  airflow-worker:
    image: airflow/etl:0.1
    container_name: cashback-airflow-worker
    profiles: ["celery"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *airflow-env
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@postgres:5432/${AIRFLOW_POSTGRES_DB:-airflow}
    user: "${AIRFLOW_UID:-50000}:0"
    command: celery worker
    volumes:
      - ./services/etl/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      - etl-staging:/data
    networks:
      - cashback-net

  # -------------------------------------------------------------------
  # Adminer — DB UI (PostgreSQL + ClickHouse)
  # -------------------------------------------------------------------
  adminer:
    image: adminer:4.8.1
    container_name: cashback-adminer
    restart: unless-stopped
    depends_on:
      - postgres
      - clickhouse
    ports:
      - "8090:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - cashback-net

  # -------------------------------------------------------------------
  # TX Simulator — synthetic transaction generator
  # -------------------------------------------------------------------
  tx-simulator:
    build:
      context: ./services/tx_simulator
      dockerfile: Dockerfile
    image: cashback/tx-simulator:0.1.0
    container_name: cashback-tx-simulator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_TOPIC_TRANSACTIONS: ${KAFKA_TOPIC_TRANSACTIONS:-transactions.raw}
      KAFKA_TOPIC_PARTITIONS: "3"
      KAFKA_TOPIC_REPLICATION: "1"
      AVRO_SCHEMA_PATH: /app/schemas/transaction_event.avsc
      PROFILES_PATH: /data/profiles.avro
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-cashback}:${POSTGRES_PASSWORD:-cashback}@postgres:5432/${POSTGRES_DB:-cashback}
    volumes:
      - ./infrastructure/kafka/schemas:/app/schemas:ro
      - tx-simulator-data:/data
    command: ["sleep", "infinity"]
    networks:
      - cashback-net

  # -------------------------------------------------------------------
  # ML Training — LightGBM ranker + ALS retrieval (SVD++).
  # On-demand only — start via `docker compose --profile ml run --rm ml-training`.
  # -------------------------------------------------------------------
  ml-training:
    build:
      context: ./services/ml_training
      dockerfile: Dockerfile
    image: cashback/ml-training:0.1.0
    container_name: cashback-ml-training
    profiles: ["ml"]
    depends_on:
      mlflow:
        condition: service_started
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-cashback}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-cashback}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-cashback}
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-cashback}:${POSTGRES_PASSWORD:-cashback}@postgres:5432/${POSTGRES_DB:-cashback}
      RFM_WINDOW_DAYS: "90"
      SVD_FACTORS: "64"
      SVD_ITERATIONS: "15"
      ARTIFACT_DIR: /data/ml-artifacts
    volumes:
      - ml-artifacts:/data/ml-artifacts
    networks:
      - cashback-net

  # -------------------------------------------------------------------
  # Recommendation API — three-stage inference (retrieve → rank → BRE).
  # Exposes :8001 with /health, /docs, /metrics, /recommendations.
  # -------------------------------------------------------------------
  recommendation-api:
    build:
      context: ./services/recommendation_api
      dockerfile: Dockerfile
    image: cashback/recommendation-api:0.1.0
    container_name: cashback-recommendation-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      mlflow:
        condition: service_started
    ports:
      - "8001:8001"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: "8001"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: cashback_lgbm_ranker
      RETRIEVAL_EXPERIMENT: cashback_retrieval
      MODEL_POLL_INTERVAL_SECONDS: "60"
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-cashback}:${POSTGRES_PASSWORD:-cashback}@postgres:5432/${POSTGRES_DB:-cashback}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-cashback}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-cashback}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-cashback}
      REDIS_URL: redis://redis:6379/0
      FEATURE_STORE_TIMEOUT_MS: "200"
      CANDIDATE_TOP_K: "20"
      DEFAULT_TOP_K: "5"
      ANTI_FATIGUE_TTL_DAYS: "14"
      FREQUENCY_GATE_PER_24H: "5"
      MIN_AWARD_THRESHOLD: "1.0"
      OTEL_SERVICE_NAME: recommendation-api
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
    volumes:
      - recommendation-api-cache:/data
    networks:
      - cashback-net

  # -------------------------------------------------------------------
  # Kafka UI — topic browser
  # -------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: cashback-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cashback
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - cashback-net
