{{/* Stub Secret for non-prod / local development.
     Real production deployments should use the external-secrets operator
     (`externalSecrets.enabled=true`) — this template is then skipped. */}}
{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cashback.secretName" . }}
  labels:
    {{- include "cashback.commonLabels" (dict "root" . "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER:     {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  REDIS_PASSWORD:    {{ .Values.secrets.redisPassword | quote }}
  JWT_SECRET:        {{ .Values.secrets.jwtSecret | quote }}
  FCM_SERVER_KEY:    {{ .Values.secrets.fcmServerKey | quote }}
  POSTGRES_DSN: >-
    postgresql+asyncpg://{{ .Values.secrets.postgresUser }}:{{ .Values.secrets.postgresPassword }}@{{ .Values.config.postgresHost }}:{{ .Values.config.postgresPort }}/{{ .Values.config.postgresDb }}
{{- else }}
{{/* When externalSecrets is on, we expect a corresponding ExternalSecret
     resource managed outside the chart. The ServiceAccount references
     this secret name regardless. */}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "cashback.secretName" . }}
  labels:
    {{- include "cashback.commonLabels" (dict "root" . "component" "secrets") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ include "cashback.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: cashback/postgres
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: cashback/redis
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: cashback/jwt
        property: secret
    - secretKey: FCM_SERVER_KEY
      remoteRef:
        key: cashback/fcm
        property: server_key
{{- end }}
