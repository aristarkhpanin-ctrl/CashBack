{{/* Two Secrets (B19, ADR-0013):
     * cashback.secretName — infrastructure credentials, mounted whole
       (envFrom) into every workload;
     * cashback.authSecretName — the token keys and the bootstrap admin
       password, read key by key (secretKeyRef) only where §1 of the stage-B
       contract allows: campaign-manager JWT_SECRET + SERVICE_JWT_SECRET,
       recommendation-api SERVICE_JWT_SECRET, mobile-api SERVICE_JWT_SECRET +
       MOBILE_JWT_SECRET; ADMIN_BOOTSTRAP_PASSWORD — the DB migration run only.
     Inline mode (dev) renders both from `secrets.*` and refuses to render
     without the auth values; production uses the external-secrets operator
     (`externalSecrets.enabled=true`) and the same two target names. */}}
{{- if not .Values.externalSecrets.enabled }}
{{- $jwt := include "cashback.secretValue" (dict "key" "secrets.jwtSecret" "value" .Values.secrets.jwtSecret "min" 32) }}
{{- $service := include "cashback.secretValue" (dict "key" "secrets.serviceJwtSecret" "value" .Values.secrets.serviceJwtSecret "min" 32) }}
{{- $mobile := include "cashback.secretValue" (dict "key" "secrets.mobileJwtSecret" "value" .Values.secrets.mobileJwtSecret "min" 32) }}
{{- $admin := include "cashback.secretValue" (dict "key" "secrets.adminBootstrapPassword" "value" .Values.secrets.adminBootstrapPassword "min" 12) }}
{{- if or (eq $jwt $service) (eq $jwt $mobile) (eq $service $mobile) }}
{{- fail "secrets.jwtSecret, secrets.serviceJwtSecret and secrets.mobileJwtSecret must all differ" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cashback.secretName" . }}
  labels:
    {{- include "cashback.commonLabels" (dict "root" . "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER:     {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  REDIS_PASSWORD:    {{ .Values.secrets.redisPassword | quote }}
  FCM_SERVER_KEY:    {{ .Values.secrets.fcmServerKey | quote }}
  POSTGRES_DSN: >-
    postgresql+asyncpg://{{ .Values.secrets.postgresUser }}:{{ .Values.secrets.postgresPassword }}@{{ .Values.config.postgresHost }}:{{ .Values.config.postgresPort }}/{{ .Values.config.postgresDb }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cashback.authSecretName" . }}
  labels:
    {{- include "cashback.commonLabels" (dict "root" . "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET:               {{ $jwt | quote }}
  SERVICE_JWT_SECRET:       {{ $service | quote }}
  MOBILE_JWT_SECRET:        {{ $mobile | quote }}
  ADMIN_BOOTSTRAP_PASSWORD: {{ $admin | quote }}
{{- else }}
{{/* When externalSecrets is on, the operator materialises both Secrets
     from the store; the Deployments reference the same names regardless. */}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "cashback.secretName" . }}
  labels:
    {{- include "cashback.commonLabels" (dict "root" . "component" "secrets") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ include "cashback.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: cashback/postgres
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: cashback/redis
        property: password
    - secretKey: FCM_SERVER_KEY
      remoteRef:
        key: cashback/fcm
        property: server_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "cashback.authSecretName" . }}
  labels:
    {{- include "cashback.commonLabels" (dict "root" . "component" "secrets") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ include "cashback.authSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: cashback/jwt
        property: secret
    - secretKey: SERVICE_JWT_SECRET
      remoteRef:
        key: cashback/service-jwt
        property: secret
    - secretKey: MOBILE_JWT_SECRET
      remoteRef:
        key: cashback/mobile-jwt
        property: secret
    - secretKey: ADMIN_BOOTSTRAP_PASSWORD
      remoteRef:
        key: cashback/admin-bootstrap
        property: password
{{- end }}
