{{- $svc := .Values.campaignManager -}}
{{- $name := "campaign-manager" -}}
{{- if $svc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cashback.componentName" (dict "root" . "name" $name) }}
  labels:
    {{- include "cashback.commonLabels" (dict "root" . "component" $name) | nindent 4 }}
spec:
  type: {{ $svc.service.type }}
  ports:
    - { name: http, port: {{ $svc.service.port }}, targetPort: http, protocol: TCP }
  selector:
    {{- include "cashback.componentSelector" (dict "root" . "component" $name) | nindent 4 }}
{{- end }}
