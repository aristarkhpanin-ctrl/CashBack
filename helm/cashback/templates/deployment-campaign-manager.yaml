{{- $svc := .Values.campaignManager -}}
{{- $name := "campaign-manager" -}}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cashback.componentName" (dict "root" . "name" $name) }}
  labels:
    {{- include "cashback.commonLabels" (dict "root" . "component" $name) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      {{- include "cashback.componentSelector" (dict "root" . "component" $name) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        {{- include "cashback.commonLabels" (dict "root" . "component" $name) | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ $svc.port | quote }}
    spec:
      serviceAccountName: {{ include "cashback.serviceAccount" . }}
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ include "cashback.image" (dict "root" . "name" $name "image" $svc.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - { containerPort: {{ $svc.port }}, name: http, protocol: TCP }
          envFrom:
            - configMapRef: { name: {{ include "cashback.configMapName" . }} }
            - secretRef:    { name: {{ include "cashback.secretName" . }} }
          env:
            - name: API_PORT
              value: {{ $svc.port | quote }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: {{ $svc.probes.livenessPath }}, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: {{ $svc.probes.readinessPath }}, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.global.containerSecurityContext | nindent 12 }}
{{- end }}
