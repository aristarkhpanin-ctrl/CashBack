{{- $svc := .Values.campaignManager -}}
{{- $name := "campaign-manager" -}}
{{- if $svc.enabled }}
{{- /* Behind the ingress every client arrives from a controller pod: without
       trusting its X-Forwarded-For the login throttle counts all clients as
       one IP (ADR-0013). */ -}}
{{- $forwardedAllowIps := trim (toString (default "" $svc.forwardedAllowIps)) -}}
{{- if and .Values.ingress.enabled (not $forwardedAllowIps) }}
{{- fail "campaignManager.forwardedAllowIps is required when ingress.enabled=true: the ingress controller's pod CIDR (e.g. 10.244.0.0/16), so that the login throttle sees real client IPs" }}
{{- end }}
{{- if eq $forwardedAllowIps "*" }}
{{- fail "campaignManager.forwardedAllowIps must not be \"*\": any pod could forge X-Forwarded-For and dodge the login throttle" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cashback.componentName" (dict "root" . "name" $name) }}
  labels:
    {{- include "cashback.commonLabels" (dict "root" . "component" $name) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      {{- include "cashback.componentSelector" (dict "root" . "component" $name) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        {{- include "cashback.commonLabels" (dict "root" . "component" $name) | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ $svc.port | quote }}
    spec:
      serviceAccountName: {{ include "cashback.serviceAccount" . }}
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ include "cashback.image" (dict "root" . "name" $name "image" $svc.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - { containerPort: {{ $svc.port }}, name: http, protocol: TCP }
          envFrom:
            - configMapRef: { name: {{ include "cashback.configMapName" . }} }
            - secretRef:    { name: {{ include "cashback.secretName" . }} }
          env:
            - name: API_PORT
              value: {{ $svc.port | quote }}
            # Admin tokens + the service key for /ml/explain → recommendation-api.
            {{- include "cashback.authSecretEnv" (dict "root" . "key" "JWT_SECRET") | nindent 12 }}
            {{- include "cashback.authSecretEnv" (dict "root" . "key" "SERVICE_JWT_SECRET") | nindent 12 }}
            - name: RECOMMENDATION_API_URL
              value: {{ printf "http://%s-recommendation-api:%d" (include "cashback.fullname" .) (int .Values.recommendationApi.service.port) | quote }}
            {{- if $forwardedAllowIps }}
            # uvicorn --proxy-headers takes the client from X-Forwarded-For of these peers only.
            - name: FORWARDED_ALLOW_IPS
              value: {{ $forwardedAllowIps | quote }}
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: {{ $svc.probes.livenessPath }}, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: {{ $svc.probes.readinessPath }}, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.global.containerSecurityContext | nindent 12 }}
{{- end }}
