apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cashback.configMapName" . }}
  labels:
    {{- include "cashback.commonLabels" (dict "root" . "component" "config") | nindent 4 }}
data:
  ENVIRONMENT:               {{ .Values.global.environment | quote }}
  LOG_LEVEL:                 {{ .Values.config.logLevel | quote }}
  POSTGRES_HOST:             {{ .Values.config.postgresHost | quote }}
  POSTGRES_PORT:             {{ .Values.config.postgresPort | quote }}
  POSTGRES_DB:               {{ .Values.config.postgresDb | quote }}
  REDIS_HOST:                {{ .Values.config.redisHost | quote }}
  REDIS_PORT:                {{ .Values.config.redisPort | quote }}
  REDIS_URL:                 {{ printf "redis://%s:%s/0" .Values.config.redisHost .Values.config.redisPort | quote }}
  CLICKHOUSE_HOST:           {{ .Values.config.clickhouseHost | quote }}
  CLICKHOUSE_HTTP_PORT:      {{ .Values.config.clickhouseHttpPort | quote }}
  KAFKA_BOOTSTRAP_SERVERS:   {{ .Values.config.kafkaBootstrapServers | quote }}
  SCHEMA_REGISTRY_URL:       {{ .Values.config.schemaRegistryUrl | quote }}
  MLFLOW_TRACKING_URI:       {{ .Values.config.mlflowTrackingUri | quote }}
  KAFKA_TOPIC_TRANSACTIONS:  {{ .Values.config.kafkaTopicTransactions | quote }}
  ACCRUALS_TOPIC:            {{ .Values.config.kafkaTopicAccruals | quote }}
  RECOMMENDATIONS_TOPIC:     {{ .Values.config.kafkaTopicRecommendations | quote }}
  OFFER_ACCEPTED_TOPIC:      {{ .Values.config.kafkaTopicOfferAccepted | quote }}
