{{- $svc := .Values.transactionListener -}}
{{- $name := "transaction-listener" -}}
{{- if and $svc.enabled $svc.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cashback.componentName" (dict "root" . "name" $name) }}
  labels:
    {{- include "cashback.commonLabels" (dict "root" . "component" $name) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "cashback.componentName" (dict "root" . "name" $name) }}
  minReplicas: {{ $svc.hpa.minReplicas }}
  maxReplicas: {{ $svc.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.hpa.targetCpuUtilizationPercentage }}
    # Custom external metric — Kafka consumer-group lag for the
    # cashback-accrual-group on the transactions.raw topic. Requires
    # prometheus-adapter (or KEDA) to expose `kafka_consumer_lag` as an
    # external metric.
    - type: External
      external:
        metric:
          name: kafka_consumer_lag
          selector:
            matchLabels:
              consumergroup: cashback-accrual-group
              topic: {{ .Values.config.kafkaTopicTransactions }}
        target:
          type: AverageValue
          averageValue: {{ $svc.hpa.kafkaConsumerLagThreshold | quote }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - { type: Pods, value: 2, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - { type: Pods, value: 1, periodSeconds: 120 }
{{- end }}
