# =====================================================================
# CashBack — Helm values
#
# Per-service replicas / resources / HPA targets follow chapter 3.3,
# table 27. Override on `helm install -f my-values.yaml`.
# =====================================================================

# ---- Global ----------------------------------------------------------
nameOverride: ""
fullnameOverride: ""

# Our application images: {registry}/{repository}/<component>:<tag>.
# Not under `global`: Bitnami subcharts apply global.imageRegistry to
# their own images as well (it wins over their image.registry), which
# would send them to ghcr.io instead of docker.io/bitnamilegacy.
image:
  registry: ghcr.io
  repository: aristarkhpanin-ctrl/cashback

global:
  environment: production
  # Unset on purpose. If set, it overrides the registry of every image —
  # ours and the subcharts' (Bitnami semantics, e.g. a pull-through mirror).
  imageRegistry: ""
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Read by the Bitnami subcharts only: the pinned versions merely warn
  # about the bitnamilegacy/* overrides below, newer ones refuse to render
  # non-bitnami/* images unless this is set (keeps a chart bump working).
  security:
    allowInsecureImages: true

# Common environment variables — exposed via ConfigMap.
config:
  logLevel: INFO
  postgresHost: postgres
  postgresPort: "5432"
  postgresDb: cashback
  redisHost: redis
  redisPort: "6379"
  clickhouseHost: clickhouse
  clickhouseHttpPort: "8123"
  kafkaBootstrapServers: kafka:9092
  schemaRegistryUrl: http://schema-registry:8081
  mlflowTrackingUri: http://mlflow:5000
  kafkaTopicTransactions: transactions.raw
  kafkaTopicAccruals: cashback.accrued
  kafkaTopicRecommendations: recommendations.created
  kafkaTopicOfferAccepted: offer.accepted
  # Browser origins allowed to call the APIs cross-origin (CORS_ORIGINS,
  # comma-separated). Empty: the UI is same-origin through the ingress;
  # "*" is rejected by the services (B36).
  corsOrigins: ""
  # `iss` of the customer tokens mobile-api accepts: the bank IdP in
  # production, scripts/mint_customer_token.py in the demo (ADR-0013).
  mobileJwtIssuer: cashback-demo-idp

# Sensitive values are referenced by name; populate via external-secrets
# operator or `helm install --set-file ...`.
externalSecrets:
  enabled: false
  secretStoreRef: aws-secrets-manager
  refreshInterval: 1h
secrets:
  postgresUser: cashback
  postgresPassword: ""
  redisPassword: ""
  # Stage B (ADR-0013): no defaults. Unless externalSecrets.enabled=true the
  # chart refuses to render until all four are set. Keys: ≥ 32 bytes, all
  # different (`openssl rand -hex 32`); they go to separate Secret keys and
  # each Deployment mounts only its own:
  jwtSecret: ""               # campaign-manager: admin access/refresh/SSE tokens
  serviceJwtSecret: ""        # campaign-manager + mobile-api sign, recommendation-api verifies
  mobileJwtSecret: ""         # mobile-api verifies customer tokens (signed by the IdP)
  # Initial password of admin@bank.ru, read by the DB migration job only
  # (≥ 12 characters; see README → Secrets).
  adminBootstrapPassword: ""
  fcmServerKey: ""

# ---- Recommendation API ---------------------------------------------
# table 27 — replicas {min:2, max:10}, hpa.cpu 70 %
recommendationApi:
  enabled: true
  image:
    repository: ""               # defaults to {image.registry}/{image.repository}/recommendation-api
    tag: ""                      # defaults to Chart.appVersion
  replicas: 2
  port: 8001
  resources:
    requests: { cpu: "500m", memory: "512Mi" }
    limits:   { cpu: "1000m", memory: "1Gi" }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCpuUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  service:
    type: ClusterIP
    port: 8001
  probes:
    livenessPath:  /health/live
    readinessPath: /health/ready
  env: {}

# ---- Campaign Manager -----------------------------------------------
# table 27 — replicas {min:2, max:6}
campaignManager:
  enabled: true
  image:
    repository: ""
    tag: ""
  replicas: 2
  port: 8002
  resources:
    requests: { cpu: "300m", memory: "384Mi" }
    limits:   { cpu: "800m", memory: "768Mi" }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCpuUtilizationPercentage: 70
  service:
    type: ClusterIP
    port: 8002
  probes:
    livenessPath:  /health/live
    readinessPath: /health/ready
  # Proxies whose X-Forwarded-For campaign-manager trusts (uvicorn
  # FORWARDED_ALLOW_IPS; IPs / CIDRs, comma-separated) for the per-client
  # login throttle: the ingress controller's pod CIDR. Required while
  # ingress.enabled — otherwise every client counts as the controller's IP
  # and 5 wrong passwords lock an e-mail for everybody. Nothing wider and
  # never "*": any pod in a trusted range can forge the client IP.
  forwardedAllowIps: ""
  env: {}

# ---- Mobile BFF ------------------------------------------------------
mobileApi:
  enabled: true
  image:
    repository: ""
    tag: ""
  replicas: 2
  port: 8003
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits:   { cpu: "750m", memory: "512Mi" }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCpuUtilizationPercentage: 70
  service:
    type: ClusterIP
    port: 8003
  probes:
    livenessPath:  /health/live
    readinessPath: /health/ready
  env: {}

# ---- Transaction Listener -------------------------------------------
# table 27 — Kafka consumer scaled by consumer-group lag.
transactionListener:
  enabled: true
  image:
    repository: ""
    tag: ""
  replicas: 2
  metricsPort: 9100
  resources:
    requests: { cpu: "300m", memory: "384Mi" }
    limits:   { cpu: "800m", memory: "768Mi" }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    # Custom metrics — requires Prometheus adapter / KEDA.
    kafkaConsumerLagThreshold: 5000
    targetCpuUtilizationPercentage: 70
  env: {}

# ---- ETL worker (Airflow) -------------------------------------------
etlWorker:
  enabled: true
  image:
    repository: ""               # airflow/etl:0.1
    tag: ""
  replicas: 1
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "2000m", memory: "2Gi" }
  hpa:
    enabled: false
  env: {}
  webserver:
    enabled: true
    port: 8080
    replicas: 1
  scheduler:
    enabled: true
    replicas: 1

# ---- ML Training (CronJob) ------------------------------------------
mlTraining:
  enabled: true
  image:
    repository: ""               # cashback/ml-training
    tag: ""
  schedule: "0 3 * * 1"          # Mondays 03:00 UTC
  resources:
    requests: { cpu: "1000m", memory: "2Gi" }
    limits:   { cpu: "4000m", memory: "8Gi" }
  retries: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  command: ["python", "-m", "app.cli", "train-all"]
  env: {}

# ---- Frontend (web) -------------------------------------------------
webFrontend:
  enabled: true
  image:
    repository: ""
    tag: ""
  replicas: 2
  port: 3000
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "256Mi" }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCpuUtilizationPercentage: 60
  service:
    type: ClusterIP
    port: 3000

# ---- Ingress --------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
  host: cashback.example.com
  tls:
    enabled: true
    secretName: cashback-tls
  paths:
    web:        /
    recoApi:    /api/recommendations(/|$)(.*)
    campaignApi: /api/campaigns(/|$)(.*)
    mobileApi:  /api/mobile(/|$)(.*)

# ---- NetworkPolicy --------------------------------------------------
networkPolicy:
  enabled: true
  # Allow Prometheus scraping from this namespace.
  monitoringNamespace: monitoring
  # External traffic from the ingress controller's namespace.
  ingressNamespace: ingress-nginx

# ---- Subcharts (off by default) -------------------------------------
# Self-contained dev/demo clusters only. The versioned docker.io/bitnami/*
# images the pinned charts reference were deleted in 2025; identical tags
# remain in docker.io/bitnamilegacy/* (frozen, unsupported, no security
# fixes), so every image a subchart can start is redirected there.
# Production: keep these disabled and point `config.*` at managed services.
# The registry stays the charts' default docker.io: our own registry is
# `image.registry`, not `global.imageRegistry` (see the top of this file).
postgresql:
  enabled: false
  image:
    repository: bitnamilegacy/postgresql
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
  metrics:
    image:
      repository: bitnamilegacy/postgres-exporter
  auth:
    username: cashback
    database: cashback

redis:
  enabled: false
  image:
    repository: bitnamilegacy/redis
  sentinel:
    image:
      repository: bitnamilegacy/redis-sentinel
  metrics:
    image:
      repository: bitnamilegacy/redis-exporter
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
  sysctl:
    image:
      repository: bitnamilegacy/os-shell
  kubectl:
    image:
      repository: bitnamilegacy/kubectl
  auth:
    enabled: false

kafka:
  enabled: false
  image:
    repository: bitnamilegacy/kafka
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
  externalAccess:
    autoDiscovery:
      image:
        repository: bitnamilegacy/kubectl
  metrics:
    # bitnami/kafka-exporter was never archived to bitnamilegacy, so
    # metrics.kafka must stay disabled (use kafka-exporter from the
    # observability stack instead).
    jmx:
      image:
        repository: bitnamilegacy/jmx-exporter
  controller:
    replicaCount: 1

clickhouse:
  enabled: false
  image:
    repository: bitnamilegacy/clickhouse
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
  zookeeper:
    image:
      repository: bitnamilegacy/zookeeper
    volumePermissions:
      image:
        repository: bitnamilegacy/os-shell
  shards: 1
  replicaCount: 1
