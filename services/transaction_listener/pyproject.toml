[project]
name = "cashback-transaction-listener"
version = "0.1.0"
description = "Transaction listener + accrual engine + notification pipeline"
requires-python = ">=3.11"
authors = [{name = "CashBack team"}]
dependencies = [
    "aiokafka>=0.11.0",
    "fastavro>=1.9.0",
    "confluent-kafka[avro,schemaregistry]>=2.5.0",
    "SQLAlchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "fakeredis>=2.21.0",
    "testcontainers[postgres,redis]>=4.4.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.notification" = ["templates/*.html"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: integration tests requiring docker / testcontainers",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["app.notification"]
branch = true
omit = [
    "tests/*",
    "alembic/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
