[project]
name = "cashback-campaign-manager"
version = "0.1.0"
description = "CashBack campaign manager — REST API, analytics & A/B testing"
requires-python = ">=3.11"
authors = [{name = "CashBack team"}]
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]>=0.30.0",
    "pydantic==2.*",
    "pydantic-settings>=2.0.0",
    "SQLAlchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",
    "clickhouse-connect>=0.7.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "scipy>=1.11.0",
    "numpy>=1.26.0,<2.0",
    "apscheduler>=3.10.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "testcontainers[postgres,redis]>=4.4.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: integration tests requiring docker / testcontainers",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "tests/*",
    "alembic/*",
    "app/__init__.py",
    "app/main.py",
    "app/db.py",
    "app/scheduling.py",
    "app/api/__init__.py",
    "app/api/health.py",
    "app/api/campaigns.py",
    "app/api/analytics.py",
    "app/api/ab_testing.py",
    "app/models.py",
    "app/schemas.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
