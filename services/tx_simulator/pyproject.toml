[project]
name = "tx-simulator"
version = "0.1.0"
description = "Synthetic transaction generator for the CashBack personalisation system"
requires-python = ">=3.11"
authors = [
    {name = "CashBack team"}
]
dependencies = [
    "confluent-kafka[schemaregistry,avro]>=2.5.0",
    "fastavro>=1.9.0",
    "click>=8.1.0",
    "faker>=25.0.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
tx-simulator = "app.simulator:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "tests/*",
    "app/__init__.py",
    "app/__main__.py",
]

[tool.coverage.report]
fail_under = 40
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
