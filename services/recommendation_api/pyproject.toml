[project]
name = "cashback-recommendation-api"
version = "0.1.0"
description = "Online inference API for the CashBack personalisation system"
requires-python = ">=3.11"
authors = [{name = "CashBack team"}]
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]>=0.30.0",
    "aiokafka>=0.11.0",
    "pydantic==2.*",
    "pydantic-settings>=2.0.0",
    "SQLAlchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
    "clickhouse-connect>=0.7.0",
    "mlflow==2.13.*",
    "lightgbm==4.3.*",
    "shap==0.45.*",
    "faiss-cpu>=1.7.4",
    "numpy>=1.26.0,<3.0",
    "pandas>=2.1.0",
    "structlog>=24.1.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "testcontainers[postgres,redis]>=4.4.0",
    "fakeredis>=2.21.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: integration tests requiring docker / testcontainers",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "tests/*",
    "alembic/*",
    "app/__init__.py",
    "app/main.py",
    "app/config.py",
    "app/feature_store.py",
    "app/candidate_gen.py",
    "app/model_registry.py",
    "app/api/__init__.py",
    "app/api/health.py",
    "app/api/recommendations.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
