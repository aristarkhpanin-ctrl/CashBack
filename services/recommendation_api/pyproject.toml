[project]
name = "cashback-recommendation-api"
version = "0.1.0"
description = "Online inference API for the CashBack personalisation system"
requires-python = ">=3.11"
authors = [{name = "CashBack team"}]
# Диапазоны — с верхней границей по мажорной версии; точные версии всего
# дерева зависимостей (для образа и CI) — в requirements.lock /
# requirements-dev.lock. После правки списка lock-файлы перегенерировать
# (из каталога сервиса):
#   uv pip compile pyproject.toml -o requirements.lock --python-version 3.11 --python-platform x86_64-unknown-linux-gnu
#   uv pip compile pyproject.toml --extra dev -c requirements.lock -o requirements-dev.lock --python-version 3.11 --python-platform x86_64-unknown-linux-gnu
dependencies = [
    "python-jose[cryptography]>=3.3.0,<4",
    "fastapi==0.115.*",
    "uvicorn[standard]>=0.30.0,<1",
    "aiokafka[zstd]>=0.11.0,<1",
    "pydantic==2.*",
    "pydantic-settings>=2.0.0,<3",
    "SQLAlchemy[asyncio]>=2.0.0,<3",
    "asyncpg>=0.29.0,<1",
    # Redis.aclose() — с 5.0.1.
    "redis[hiredis]>=5.0.1,<9",
    "clickhouse-connect>=0.7.0,<2",
    # httpx — проверка MLflow в /health/ready (раньше был только в dev:
    # без него в образе проверка падает на импорте и readiness всегда 503).
    "httpx>=0.27.0,<1",
    # mlflow/lightgbm/shap — те же минорные версии, что в ml_training и
    # у MLflow-сервера (ghcr.io/mlflow/mlflow:v2.13.0).
    "mlflow==2.13.*",
    "lightgbm==4.3.*",
    "shap==0.45.*",
    "faiss-cpu>=1.7.4,<2",
    "numpy>=1.26.0,<2.0",
    "pandas>=2.1.0,<3",
    "structlog>=24.1.0,<27",
    "prometheus-fastapi-instrumentator>=7.0.0,<8",
    # OpenTelemetry: mlflow 2.13 требует protobuf<5, а opentelemetry-proto
    # с 1.28 — protobuf>=5, поэтому семейство ограничено 1.27 / 0.48b0.
    # Без этих границ pip перебирает все релизы OTel и падает с
    # resolution-too-deep. Экспортёр — только OTLP/HTTP (его и импортирует
    # app/main.py), без gRPC-экспортёра и grpcio.
    "opentelemetry-api>=1.25.0,<1.28",
    "opentelemetry-sdk>=1.25.0,<1.28",
    "opentelemetry-instrumentation-fastapi>=0.46b0,<0.49b0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0,<1.28",
    # opentelemetry-instrumentation 0.48b0 импортирует pkg_resources,
    # который удалён из setuptools 82.
    "setuptools>=16.0,<82",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10",
    "pytest-asyncio>=0.23.0,<2",
    "pytest-cov>=4.1.0,<8",
    "testcontainers[postgres,redis]>=4.4.0,<5",
    "fakeredis>=2.21.0,<3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: integration tests requiring docker / testcontainers",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "tests/*",
    "alembic/*",
    "app/__init__.py",
    "app/main.py",
    "app/config.py",
    "app/feature_store.py",
    "app/candidate_gen.py",
    "app/model_registry.py",
    "app/api/__init__.py",
    "app/api/health.py",
    "app/api/recommendations.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
