[project]
name = "cashback-mobile-api"
version = "0.1.0"
description = "Mobile BFF for the CashBack personalisation system"
requires-python = ">=3.11"
authors = [{name = "CashBack team"}]
dependencies = [
    "fastapi>=0.115,<0.139",
    "uvicorn[standard]>=0.30.0",
    "pydantic==2.*",
    "pydantic-settings>=2.0.0",
    "SQLAlchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.27.0",
    "aiokafka>=0.11.0",
    "tenacity>=8.2.0",
    "apscheduler>=3.10.0",
    "structlog>=24.1.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "testcontainers[postgres,redis]>=4.4.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: integration tests requiring docker / testcontainers",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["app.clients", "app.mcc_registry"]
branch = true
omit = [
    "tests/*",
    "alembic/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
